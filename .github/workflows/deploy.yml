name:Deploy Static Portfolio to GitHub Pages

on:
  push:
     branches: ["main"]
   workflow_dispatch:
 
permissions:
  contents:read
  pages:write
  id-token: write

concurrency:
  group:"pages"
  cancel-in-progress:false

jobs:
  build:
  runs-on:ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

      -name: Setup Pages
      uses: actions/configure-pages@v5

